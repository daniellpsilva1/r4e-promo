<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Run4Excellence | Train like the pros</title>
<meta name="description" content="Train like professional football players. Training videos, tests, body composition and tracking in one app.">
<meta property="og:title" content="Run4Excellence | Train like the pros">
<meta property="og:type" content="website">
<style>
:root{--blue:#1677ff;--navy:#05070d;--navy2:#0b1430;--grey:#999}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(1200px 600px at 50% -10%,#0b1430,#05070d 70%) fixed;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 5vw}
header img{height:44px}
.lang{display:flex;gap:6px;background:#111;border-radius:999px;padding:4px}
button{font:inherit;cursor:pointer;border:0;color:#fff;background:transparent}
.lang button,.fmt button{padding:8px 16px;border-radius:999px;font-weight:700;font-size:14px;letter-spacing:.04em}
.on{background:var(--blue)!important}
main{max-width:1100px;margin:0 auto;padding:0 5vw 60px;text-align:center}
h1{font-size:clamp(32px,6vw,64px);font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:-.01em;line-height:1.05;margin:28px 0 12px}
h1 span{color:var(--blue)}
p.sub{color:#c8d0e0;font-size:clamp(16px,2vw,20px);max-width:640px;margin:0 auto 28px}
.fmt{display:inline-flex;gap:6px;background:#111;border-radius:999px;padding:4px;margin-bottom:20px}
.stage{display:flex;justify-content:center}
video{width:100%;max-width:100%;border-radius:18px;background:#000;box-shadow:0 0 0 1px #1c2a4d,0 30px 80px rgba(22,119,255,.25)}
video.v{max-width:min(420px,88vw);max-height:78vh}
.cta{margin-top:44px}
.cta h2{font-size:clamp(20px,3vw,28px);font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:18px}
.badges{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.badges img{height:52px;border:1px solid #fff;border-radius:10px;display:block}
footer{color:var(--grey);font-size:13px;text-align:center;padding:30px 5vw}
</style>
</head>
<body>
<header>
  <img src="assets/logo.svg" alt="Run4Excellence">
  <div class="lang" id="lang"><button data-l="en" class="on">EN</button><button data-l="pt">PT</button></div>
</header>
<main>
  <h1 id="h1">Train like <span>the pros</span></h1>
  <p class="sub" id="sub">Training videos, tests, body composition and tracking in one app.</p>
  <div class="fmt" id="fmt"><button data-f="16x9" class="on" id="b169">Landscape</button><button data-f="9x16" id="b916">Vertical</button></div>
  <div class="stage"><video id="vid" controls playsinline preload="metadata"></video></div>
  <div class="cta">
    <h2 id="dl">Download now</h2>
    <div class="badges">
      <a href="https://apps.apple.com/us/app/run4excellence/id6470281317" target="_blank" rel="noopener"><img src="assets/app-store-en.svg" alt="App Store"></a>
      <a href="https://play.google.com/store/apps/details?id=com.run4excellence" target="_blank" rel="noopener"><img src="assets/google-play-en.png" alt="Google Play"></a>
    </div>
  </div>
</main>
<footer>&copy; Run4Excellence. Excellence in training.</footer>
<script>
var T={en:{h:'Train like <span>the pros</span>',s:'Training videos, tests, body composition and tracking in one app.',d:'Download now',a:'Landscape',b:'Vertical'},pt:{h:'Treina como <span>os pros</span>',s:'Vídeos de treino, testes, composição corporal e tracking numa só app.',d:'Descarrega agora',a:'Horizontal',b:'Vertical'}};
var lang=(navigator.language||'en').slice(0,2)==='pt'?'pt':'en',fmt='16x9',v=document.getElementById('vid');
function set(){var t=T[lang];document.documentElement.lang=lang;document.getElementById('h1').innerHTML=t.h;document.getElementById('sub').textContent=t.s;document.getElementById('dl').textContent=t.d;document.getElementById('b169').textContent=t.a;document.getElementById('b916').textContent=t.b;
document.querySelectorAll('#lang button').forEach(function(b){b.classList.toggle('on',b.dataset.l===lang)});
document.querySelectorAll('#fmt button').forEach(function(b){b.classList.toggle('on',b.dataset.f===fmt)});
v.classList.toggle('v',fmt==='9x16');v.poster='video/r4e-'+lang+'-'+fmt+'.jpg';v.src='video/r4e-'+lang+'-'+fmt+'.mp4';}
document.getElementById('lang').onclick=function(e){if(e.target.dataset.l){lang=e.target.dataset.l;set()}};
document.getElementById('fmt').onclick=function(e){if(e.target.dataset.f){fmt=e.target.dataset.f;set()}};
set();
</script>
</body>
</html>
